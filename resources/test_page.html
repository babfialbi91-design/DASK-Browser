<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DASK Browser Test Page</title>
<style>
  body {
    font-family: "Segoe UI", sans-serif;
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: linear-gradient(160deg, #1b1f2a, #10131a);
    color: #e8eaf0;
  }
  .card {
    text-align: center;
    padding: 3rem 4rem;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.04);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  h1 { font-size: 2.2rem; margin: 0 0 .5rem; letter-spacing: .05em; }
  .ok { color: #57d9a3; font-weight: 600; }
  .meta { color: #9aa3b2; font-size: .9rem; margin-top: 1.5rem; }
</style>
</head>
<body>
<div class="card">
  <h1>DASK Browser</h1>
  <p class="ok" id="status">Chromium engine is rendering this page.</p>
  <div class="meta" id="meta"></div>
</div>
<script>
  // Simple runtime proof that JS runs inside the embedded Chromium.
  document.getElementById("meta").textContent =
    "UA: " + navigator.userAgent;
</script>
</body>
</html>
